name: Manual - Delete All Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete_all_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs (repo-wide)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const perPage = 100;
            let totalDeleted = 0;

            core.info(`Collecting workflow runs for ${owner}/${repo}...`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: perPage }
            );

            core.info(`Total runs found: ${runs.length}`);

            for (const run of runs) {
              core.info(`Deleting run id=${run.id} status=${run.status} created_at=${run.created_at}`);
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
              totalDeleted++;
            }

            core.info(`Done. Deleted runs: ${totalDeleted}`);
